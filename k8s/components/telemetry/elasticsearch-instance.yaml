apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: es-cluster
spec:
  version: 8.5.3
  auth:
    disableElasticUser: true
    fileRealm:
      - secretName: es-admin-credentials
  nodeSets:
    - name: default
      count: 1
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources:
                limits:
                  cpu: 700m
                  memory: 1Gi
                requests:
                  cpu: 250m
                  memory: 250Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: es-admin-credentials
type: kubernetes.io/basic-auth
stringData:
  username: admin
  password: changeme
  roles: superuser
